camera_node:
  ros__parameters:
    camera_id: 0                     # /dev/video0
    frame_rate: 15.0                 # fps publikasi kamera
    frame_width: 640
    frame_height: 480
    image_topic: /camera/image_raw
    frame_id: camera_optical_frame

detector_node:
  ros__parameters:
    # Ganti dengan path model custom kamu, contoh:
    # model_path: /home/raka/models/bibit_padi_best.pt
    model_path: yolov8n.pt
    image_topic: /camera/image_raw
    detections_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    confidence_threshold: 0.5
    iou_threshold: 0.45
    device: cpu                      # ganti 'cuda:0' jika ada GPU NVIDIA
    publish_annotated: true
    max_detection_rate: 10.0         # maksimal frame/detik yang diinferensi

classifier_node:
  ros__parameters:
    # Path model Keras .h5 -- isi lewat argumen launch model_path:=...
    # atau langsung di sini:
    model_path: ""
    image_topic: /camera/image_raw
    results_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    # Urutan kelas HARUS mengikuti indeks flow_from_directory
    # (alfabetis nama folder dataset saat training):
    class_names: ["Bibit Padi (Bagus)", "Bibit Padi (Tidak Bagus)"]
    input_width: 224                 # sesuai target_size training
    input_height: 224
    threshold: 0.5                   # sigmoid > 0.5 -> kelas indeks 1
    publish_annotated: true
    max_classification_rate: 10.0
    use_gpu: false                   # TF dipaksa CPU (aman dgn CUDA 12.x)

classifier_trt_node:
  ros__parameters:
    # Path model .onnx (hasil convert dari .h5) atau .engine yang sudah jadi.
    # Isi lewat argumen launch model_path:=... atau di sini:
    model_path: "/home/jetson/ros2_ws/src/rice_vision_ros2/rice_vision/models/models_bibit_padi.onnx"
    # Path simpan/muat cache engine. Kosong = model_path + ".engine".
    engine_cache: ""
    image_topic: /camera/image_raw
    results_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    class_names: ["Bibit Padi (Bagus)", "Bibit Padi (Tidak Bagus)"]
    input_width: 0                   # 0 = auto (dibaca dari engine)
    input_height: 0
    layout: "auto"                   # auto | nhwc | nchw
    threshold: 0.5
    fp16: true                       # engine FP16 (lebih cepat)
    workspace_mb: 2048               # memori saat build engine dari ONNX
    publish_annotated: true
    max_classification_rate: 30.0

viewer_node:
  ros__parameters:
    annotated_topic: /rice_vision/annotated_image
    detections_topic: /rice_vision/detections
    window_name: "Rice Vision - Deteksi Objek"
    panel_width: 320                 # lebar panel info (px) di sisi kanan
    show_display_fps: true

sink_bridge_node:
  ros__parameters:
    transport: "mqtt"                # "mqtt" atau "serial"
    # Konfigurasi MQTT (Sink Node NPA-VEE-RW612 / Broker SmartGreenhouse)
    mqtt_broker: "168.110.214.70"
    mqtt_port: 1883
    mqtt_client_id: "rice_vision_collab_agent"
    mqtt_username: ""
    mqtt_password: ""
    mqtt_keepalive: 60
    topic_prefix: ""                 # prefix opsional (misal "gh01/")
    topic_command: "mission/command" # Cloud -> Sink Node -> Collaboration Agent (<= 192 byte)
    topic_status: "mission/status"   # Collaboration Agent -> Sink Node -> Cloud (<= 128 byte)
    topic_result: "mission/result"   # Collaboration Agent -> Sink Node -> Cloud (<= 256 byte)
    # Konfigurasi Serial UART (opsional jika Sink Node RW612 dihubungkan via USB-Serial)
    serial_port: "/dev/ttyACM0"
    serial_baudrate: 115200
    serial_timeout: 1.0

collaboration_agent_node:
  ros__parameters:
    robot_id: "RB01"                 # ID Robot Collaboration Agent (r_id)
    greenhouse_id: "SH01"            # ID Smart Greenhouse (h_id)
    status_interval_sec: 3.0         # Interval Ti = 2-5 s saat misi aktif
    tray_inspection_interval_sec: 15.0 # Interval inspeksi per tray (~ 15-30 s)
    auto_inspect: true               # Jalankan inspeksi tray secara otomatis
    detections_topic: "/rice_vision/detections"
    battery_initial: 84              # Tingkat baterai awal (%)
    simulate_battery_drain: true     # Penurunan baterai perlahan saat misi aktif

