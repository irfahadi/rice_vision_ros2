camera_node:
  ros__parameters:
    camera_id: 0                     # /dev/video0
    frame_rate: 15.0                 # fps publikasi kamera
    frame_width: 640
    frame_height: 480
    image_topic: /camera/image_raw
    frame_id: camera_optical_frame

detector_node:
  ros__parameters:
    # Ganti dengan path model custom kamu, contoh:
    # model_path: /home/raka/models/bibit_padi_best.pt
    model_path: yolov8n.pt
    image_topic: /camera/image_raw
    detections_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    confidence_threshold: 0.5
    iou_threshold: 0.45
    device: cpu                      # ganti 'cuda:0' jika ada GPU NVIDIA
    publish_annotated: true
    max_detection_rate: 10.0         # maksimal frame/detik yang diinferensi

viewer_node:
  ros__parameters:
    annotated_topic: /rice_vision/annotated_image
    detections_topic: /rice_vision/detections
    window_name: "Rice Vision - Deteksi Objek"
    panel_width: 320                 # lebar panel info (px) di sisi kanan
    show_display_fps: true
