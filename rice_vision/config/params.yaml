camera_node:
  ros__parameters:
    camera_id: 0                     # /dev/video0
    frame_rate: 15.0                 # fps publikasi kamera
    frame_width: 640
    frame_height: 480
    image_topic: /camera/image_raw
    frame_id: camera_optical_frame

detector_node:
  ros__parameters:
    # Ganti dengan path model custom kamu, contoh:
    # model_path: /home/raka/models/bibit_padi_best.pt
    model_path: yolov8n.pt
    image_topic: /camera/image_raw
    detections_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    confidence_threshold: 0.5
    iou_threshold: 0.45
    device: cpu                      # ganti 'cuda:0' jika ada GPU NVIDIA
    publish_annotated: true
    max_detection_rate: 10.0         # maksimal frame/detik yang diinferensi

classifier_node:
  ros__parameters:
    # Path model Keras .h5 -- isi lewat argumen launch model_path:=...
    # atau langsung di sini:
    model_path: ""
    image_topic: /camera/image_raw
    results_topic: /rice_vision/detections
    annotated_topic: /rice_vision/annotated_image
    # Urutan kelas HARUS mengikuti indeks flow_from_directory
    # (alfabetis nama folder dataset saat training):
    class_names: ["Bibit Padi (Bagus)", "Bibit Padi (Tidak Bagus)"]
    input_width: 224                 # sesuai target_size training
    input_height: 224
    threshold: 0.5                   # sigmoid > 0.5 -> kelas indeks 1
    publish_annotated: true
    max_classification_rate: 10.0
    use_gpu: false                   # TF dipaksa CPU (aman dgn CUDA 12.x)

viewer_node:
  ros__parameters:
    annotated_topic: /rice_vision/annotated_image
    detections_topic: /rice_vision/detections
    window_name: "Rice Vision - Deteksi Objek"
    panel_width: 320                 # lebar panel info (px) di sisi kanan
    show_display_fps: true
